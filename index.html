<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#F6F2EA" />
<meta name="description" content="Limpa's Breakfast: a 2v2 team card game. Play with friends on one phone, or against the computer." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-title" content="Limpa's" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Limpa's Breakfast</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
/* Loading screen: styled here so it shows before the stylesheet, the fonts and the game code arrive */
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#F6F2EA;color:#211A15;pointer-events:none;transition:opacity .35s ease-out}
#splash.out{opacity:0}
#splash .sky{position:relative;width:200px;height:118px;overflow:hidden;border-bottom:2px solid #CFC3B1}
#splash .sun{position:absolute;left:50%;bottom:-40px;width:104px;height:104px;margin-left:-52px;border-radius:50%;background:#D9731C;box-shadow:0 0 0 12px rgba(217,115,28,.16),0 0 0 26px rgba(217,115,28,.08);animation:sp-sun 1.1s cubic-bezier(.2,.8,.2,1) both}
#splash .c{position:absolute;left:50%;bottom:8px;width:44px;height:62px;margin-left:-22px;border-radius:7px;background:#fff;border:1px solid #E0D7C8;box-shadow:0 4px 10px rgba(33,26,21,.14);transform-origin:50% 100%;font:700 20px/62px Georgia,serif;text-align:center;transform:translateX(var(--x)) rotate(var(--r));animation:sp-fan .7s cubic-bezier(.2,.8,.2,1) both}
#splash .c1{--r:-14deg;--x:-34px;color:#211A15;animation-delay:.25s}
#splash .c2{--r:0deg;--x:0px;z-index:1;bottom:14px;background:#2C231C;border-color:#2C231C;color:#F6F2EA;font-style:italic;animation-delay:.35s}
#splash .c3{--r:14deg;--x:34px;color:#B3261E;animation-delay:.45s}
#splash .name{font:600 30px/1.05 "Fraunces",Georgia,"Times New Roman",serif;letter-spacing:-.01em;animation:sp-in .6s .5s ease-out both}
#splash .dots{display:flex;gap:7px;animation:sp-in .4s .8s ease-out both}
#splash .dots i{width:7px;height:7px;border-radius:50%;background:#857A6F;animation:sp-dot 1.1s ease-in-out infinite}
#splash .dots i:nth-child(2){animation-delay:.15s}
#splash .dots i:nth-child(3){animation-delay:.3s}
@keyframes sp-sun{from{transform:translateY(70px)}to{transform:none}}
@keyframes sp-fan{from{transform:translateY(90px) rotate(0)}to{transform:translateX(var(--x)) rotate(var(--r))}}
@keyframes sp-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes sp-dot{0%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){#splash *,#splash{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Loading Limpa's Breakfast"><div class="sky"><div class="sun"></div><div class="c c1">A♠</div><div class="c c2">L</div><div class="c c3">K♥</div></div><div class="name">Limpa's Breakfast</div><div class="dots"><i></i><i></i><i></i></div></div>
<div id="app"></div>
<div class="rotate"><div class="ph">📱</div><div class="logo" style="font-size:28px">Limpa's Breakfast</div><p>Turn your phone <b>upright</b> to play.</p></div>

<!-- icons: one stroke set, used as <svg class="ic"><use href="#i-name"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.1c2.7.2 4.5 2.2 4.5 4.9"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 8L12 3.5 16.5 8"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.2"/><path d="M15.5 8.5V6.2A1.7 1.7 0 0 0 13.8 4.5H6.2A1.7 1.7 0 0 0 4.5 6.2v7.6a1.7 1.7 0 0 0 1.7 1.7h2.3"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9.5 18h5M10.3 21h3.4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 2.2M9.5 2.5h5"/></symbol>
    <symbol id="i-slow" viewBox="0 0 24 24"><path d="M4.5 17.5a7.5 7.5 0 1 1 15 0"/><path d="M12 17.5l-3.2-4.2"/><circle cx="12" cy="17.5" r="1.2"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4.5 9.5v5h3.5l4.5 4v-13L8 9.5H4.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.7 7.7 0 0 1 0 11"/></symbol>
    <symbol id="i-record" viewBox="0 0 24 24"><path d="M6.5 3.5h10a2 2 0 0 1 2 2v15h-11a2 2 0 0 1-2-2v-13a2 2 0 0 1 1-2z"/><path d="M5.5 17.5a2 2 0 0 1 2-2h11M9.5 8h5M9.5 11h3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M20.5 3.5l-9 9M20.5 3.5L14.8 20l-3.3-7.5L4 9.2z"/></symbol>
  </defs>
</svg>

<script src="js/engine.js"></script>
<script src="js/gamelog.js"></script>
<script src="js/vendor/peerjs.min.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  // when an update takes over, reload once so the new version is the one on screen
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
<noscript>Limpa's Breakfast needs JavaScript to run.</noscript>
</body>
</html>
