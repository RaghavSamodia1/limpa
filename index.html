<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#F6F2EA" />
<meta name="description" content="Limpa's Breakfast: a 2v2 team card game. Play with friends on one phone, or against the computer." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
<div id="app"></div>
<div class="rotate"><div class="ph">📱</div><div class="logo" style="font-size:28px">Limpa's Breakfast</div><p>Turn your phone <b>upright</b> to play.</p></div>

<!-- icons: one stroke set, used as <svg class="ic"><use href="#i-name"/></svg> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c0-3.2 2.7-5.5 6-5.5s6 2.3 6 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.1c2.7.2 4.5 2.2 4.5 4.9"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 8L12 3.5 16.5 8"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.2"/><path d="M15.5 8.5V6.2A1.7 1.7 0 0 0 13.8 4.5H6.2A1.7 1.7 0 0 0 4.5 6.2v7.6a1.7 1.7 0 0 0 1.7 1.7h2.3"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9.5 18h5M10.3 21h3.4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 2.2M9.5 2.5h5"/></symbol>
    <symbol id="i-slow" viewBox="0 0 24 24"><path d="M4.5 17.5a7.5 7.5 0 1 1 15 0"/><path d="M12 17.5l-3.2-4.2"/><circle cx="12" cy="17.5" r="1.2"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4.5 9.5v5h3.5l4.5 4v-13L8 9.5H4.5z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.7 7.7 0 0 1 0 11"/></symbol>
    <symbol id="i-record" viewBox="0 0 24 24"><path d="M6.5 3.5h10a2 2 0 0 1 2 2v15h-11a2 2 0 0 1-2-2v-13a2 2 0 0 1 1-2z"/><path d="M5.5 17.5a2 2 0 0 1 2-2h11M9.5 8h5M9.5 11h3"/></symbol>

<script src="js/engine.js"></script>
<script src="js/gamelog.js"></script>
<script src="js/vendor/peerjs.min.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  // when an update takes over, reload once so the new version is the one on screen
  navigator.serviceWorker.addEventListener("controllerchange", function () { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
<noscript>Limpa's Breakfast needs JavaScript to run.</noscript>
</body>
</html>
